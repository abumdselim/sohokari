name = "kaazai"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "sohokari-db"
database_id = "f335655f-8553-42b0-86f0-e708ef5385d2"

# Cloudflare Vectorize binding
[[vectorize]]
binding = "VECTORIZE"
index_name = "sohokari-citizen-services-m3"

# Cloudflare R2 bucket binding
[[r2_buckets]]
binding = "R2_ASSETS"
bucket_name = "sohokari-assets"

# Workers AI binding (for on-edge embedding generation)
[ai]
binding = "AI"
